site_name: Commodity Market Intelligence & Quant Platform
site_description: Architecture, Data Models, Data Provider Swapping Guide, and Phase Specifications.
site_author: Quantitative Research & Systems Engineering Team
copyright: "Copyright &copy; 2026. For analytical workflow automation only — Not financial advice or trading calls."

repo_name: commodity-market-smart-analyst
repo_url: https://github.com/nansari-0134/commodity-market-smart-analyst

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  language: en
  palette:
    scheme: default
    primary: white
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


nav:
  - System Overview: index.md
  - Architecture & Modules:
      - Market Data & Observations: modules/market-data.md
      - Physical Commodities: modules/commodity-master.md
      - Exchanges & Calendars: modules/exchanges-and-calendars.md
      - Futures & Derivatives: modules/contracts-and-derivatives.md
      - Taxonomy & Units: modules/taxonomy-and-units.md
      - Metadata Catalog: modules/feature-catalog-overview.md
      - Data Providers: modules/provider-master.md
      - Datasets & Feeds: modules/dataset-master.md
      - Endpoints & Routing: modules/endpoint-master.md
      - Variables & Metrics: modules/variable-master.md
      - Core Infrastructure: modules/core-infrastructure.md
  - Integration Guides:
      - Swapping Data Providers & LLMs: guides/data-sources.md
      - Adding Features & Variables: guides/adding-new-feature.md
      - Adding Commodities & Venues: guides/adding-new-commodity-and-exchange.md
      - Development & Operations: guides/development.md
  - REST API Reference:
      - API Overview: api/overview.md
      - Market Data API: api/market-data.md
      - Physical Commodities API: api/commodities.md
      - Futures & Contracts API: api/contracts.md
      - Exchanges & Calendars API: api/exchanges.md
      - Units & Metadata API: api/metadata.md
      - Dataset Catalog API: api/datasets.md
      - Variable Catalog API: api/variables.md
      - Provider Catalog API: api/providers.md
      - Endpoint Catalog API: api/endpoints.md
