site_name: Commodity Market Intelligence & Quant Platform
site_description: Architecture, Data Models, Data Provider Swapping Guide, and Phase Specifications.
site_author: Quantitative Research & Systems Engineering Team
copyright: "Copyright &copy; 2026. For analytical workflow automation only — Not financial advice or trading calls."

repo_name: commodity-market-smart-analyst
repo_url: https://github.com/nansari-0134/commodity-market-smart-analyst

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  language: en
  palette:
    scheme: default
    primary: white
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


nav:
  - System Overview: index.md
  - Chapter 1 — System Execution Flow: flow-of-execution.md
  - Chapter 2 — Asset & Venue Foundations:
      - Physical Commodities & Specifications: modules/commodity-master.md
      - Exchanges & Operating Calendars: modules/exchanges-and-calendars.md
      - Futures Contracts & Expiry Rules: modules/contracts-and-derivatives.md
      - Dimensional Units & Math Conversions: modules/taxonomy-and-units.md
      - Core Infrastructure: modules/core-infrastructure.md
  - Chapter 3 — Metadata & Feature Catalog:
      - Catalog Architecture & Data Map: modules/feature-catalog-overview.md
      - Data Provider Master: modules/provider-master.md
      - Dataset Master: modules/dataset-master.md
      - Endpoint & Route Metadata: modules/endpoint-master.md
      - Variable Master & Metrics: modules/variable-master.md
  - Chapter 4 — Ingestion & Market Observation Store:
      - Market Data & Time-Series Observations: modules/market-data.md
  - Chapter 5 — Integration & Swapping Playbooks:
      - How to Swap Data Providers & LLMs: guides/data-sources.md
      - How to Add New Features, Datasets & Variables: guides/adding-new-feature.md
      - How to Add Commodities & Venues: guides/adding-new-commodity-and-exchange.md
      - Development & CLI Workflows: guides/development.md
  - Chapter 6 — REST API Reference:
      - API Overview & Authentication: api/overview.md
      - Market Data & Observations API: api/market-data.md
      - Physical Commodities API: api/commodities.md
      - Futures & Contracts API: api/contracts.md
      - Exchanges & Calendars API: api/exchanges.md
      - Units & Metadata API: api/metadata.md
      - Dataset Catalog API: api/datasets.md
      - Variable Catalog API: api/variables.md
      - Provider Catalog API: api/providers.md
      - Endpoint Catalog API: api/endpoints.md
